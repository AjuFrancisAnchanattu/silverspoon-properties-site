<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | Silver Spoon Properties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<link rel="icon" href="images/favicon.png" type="image/png">
<script src="js/tracking.js"></script>
<link rel="stylesheet" href="css/base.css">
<style>
  /* Standalone homepage placeholder. Swapped in/out by scripts/homepage.sh,
     the real homepage is kept untouched in index.live.html. */
  html, body{ height:100%; }
  body{ background:var(--ink); color:var(--white); }

  .cs{
    position:relative; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:44px 16px; text-align:center; overflow:hidden;
  }
  .cs video, .cs-scrim{ position:absolute; inset:0; width:100%; height:100%; }
  .cs video{ object-fit:cover; z-index:0; }
  .cs-scrim{ z-index:1; background:rgba(10,9,8,.45); }

  .cs-logo{ position:absolute; top:44px; left:0; right:0; z-index:2; display:flex; justify-content:center; }
  .cs-logo img{ height:58px; width:auto; }

  .cs h1{
    position:relative; z-index:2;
    font-family:var(--serif); font-weight:400; line-height:1.08;
    font-size:clamp(44px,8vw,104px);
  }

  @media (max-width:640px){
    .cs-logo{ top:32px; }
    .cs-logo img{ height:46px; }
  }
</style>
</head>
<body>

  <main class="cs">
    <video autoplay muted loop playsinline poster="images/dubai-city-burj-khalifa-skyline-silhouette-cityscape-dusk-3840x1080-5904.jpg">
      <source src="videos/herovideo.mp4" type="video/mp4">
    </video>
    <div class="cs-scrim"></div>

    <div class="cs-logo">
      <img src="images/logo/logo.png" alt="Silver Spoon Properties">
    </div>

    <h1>Coming Soon</h1>
  </main>

</body>
</html>
