name: Sort project media

on:
  push:
    branches: [main]
    paths:
      - "content/projects/*.json"
      - "images/projects/**"

permissions:
  contents: write

jobs:
  sort:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sort uploaded media into per-project folders
        run: python3 scripts/sort_project_media.py

      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-sort uploaded project media into per-project folders [skip ci]"
            git push
          else
            echo "Nothing to sort."
          fi
