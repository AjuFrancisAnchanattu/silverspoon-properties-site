backend:
  name: github
  repo: AjuFrancisAnchanattu/silverspoon-properties-site
  branch: main
  base_url: https://dawn-bird-577f.ajufrancisanchanattu.workers.dev
  auth_endpoint: auth

# CONFIRMED (not a guess — checked decapcms.org docs + decaporg/decap-cms
# issue #6990 on GitHub): {{slug}}/{{fields.id}}/etc. template tags in
# media_folder are NOT an implemented Decap CMS feature — it's an open
# feature request that's never shipped. That's why both were tried here
# and both silently produced a folder literally named "{{slug}}" or
# "{{fields.id}}" instead of resolving (hit this for real 3 times:
# cedarwood-estates, fairways-3, oasis-lavita). Don't try a 4th template
# variant — it will fail the same way.
#
# The only way to get Decap to scope the media picker to one project
# folder for real is restructuring each entry into its own folder
# (collection `path` option + relative media_folder) — a bigger
# migration the user explicitly chose to skip in favor of this simpler
# setup. So: all uploads go to one shared pool, and
# .github/workflows/sort-project-media.yml auto-moves each file into its
# project's images/projects/<slug>/ folder (hero.jpg / gallery-01.jpg
# naming convention, see each project's README.txt) within ~30-60s of
# save. Accepted trade-off: right after uploading, the media picker may
# briefly show another project's not-yet-swept file.
media_folder: "images/projects/_uploads"
public_folder: "/images/projects/_uploads"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    identifier_field: name
    summary: "{{name}} — {{developer}}"
    fields:
      - label: "Project ID (slug)"
        name: "id"
        widget: "string"
        hint: "Lowercase, hyphens only, no spaces (e.g. cedarwood-estates). This becomes both the filename and the image folder name — don't change it after the project is live, or its images/URL will break."
      - { label: "Project Name", name: "name", widget: "string" }
      - { label: "Developer", name: "developer", widget: "string" }
      - { label: "Community / Location", name: "community", widget: "string" }
      - label: "Community Type"
        name: "tags"
        widget: "select"
        multiple: true
        options: ["golf", "waterfront"]
        required: false
        hint: "Drives the Golf Community / Waterfront filter on the Project Focus page."
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Off-Plan", value: "off-plan" }
          - { label: "Ready", value: "ready" }
        default: "off-plan"
      - { label: "Price Range", name: "priceRange", widget: "string", default: "Coming soon" }
      - { label: "Payment Plan", name: "paymentPlan", widget: "string", default: "Coming soon" }
      - { label: "Handover Date", name: "handoverDate", widget: "string", default: "Coming soon" }
      - label: "Unit Types"
        name: "unitTypes"
        widget: "list"
        default: ["Coming soon"]
        hint: "e.g. 4 Bedroom Villa. Leave as \"Coming soon\" (single entry) if not confirmed yet."
      - label: "Bedroom Options"
        name: "bedroomOptions"
        widget: "list"
        required: false
        hint: "One number per line, e.g. 4, 5, 6 — not currently shown on the site, informational only."
      - label: "Unit Counts (optional)"
        name: "unitCounts"
        widget: "keyvalue"
        required: false
        hint: "Key = unit type (must match Unit Types above exactly), value = count. Leave empty if unknown."
      - label: "Plot Area (optional)"
        name: "plotArea"
        widget: "keyvalue"
        required: false
        hint: "Key = unit type, value = area range e.g. \"6,361 – 7,406 sq.ft.\""
      - label: "Saleable Area (optional)"
        name: "saleableArea"
        widget: "keyvalue"
        required: false
      - { label: "Building Height", name: "buildingHeight", widget: "string", required: false }
      - { label: "Amenities", name: "amenities", widget: "list", required: false }
      - { label: "Technical Spec", name: "technicalSpec", widget: "text", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Leena's Take", name: "leenasTake", widget: "text", hint: "Your own personal note on this project — shown as a pull-quote on the project page." }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "src", widget: "image" }
        hint: "Add as many as you like — each becomes one tile in the gallery grid."
      - label: "Floor Plans"
        name: "floorPlans"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string", hint: "e.g. 4 Bedroom Villa" }
          - { label: "Image", name: "image", widget: "image" }
      - label: "YouTube Videos (optional)"
        name: "youtubeVideos"
        widget: "list"
        required: false
        field: { label: "YouTube Video ID", name: "id", widget: "string", hint: "Just the ID from the URL, e.g. dQw4w9WgXcQ — not the full link." }
      - { label: "Brochure PDF (optional)", name: "brochureUrl", widget: "file", required: false }
      - { label: "Internal Note (not shown on the site)", name: "sourceNote", widget: "text", required: false }
